                core.info(`COMMIT_OK attempt=${Eu} sha=${JMhUv.commit.sha} msg=${_B9N}`);
                return;
              } catch (UYWy) {
                ZNpK = UYWy;
                if (UYWy.status === 409 && Eu < 4) {
                  core.warning(`Conflict on attempt ${Eu}, retrying...`);
                  await new Promise((r) => setTimeout(r, 1200 * Eu));
                  continue;
                }
                throw UYWy;
              }
            }
            throw ZNpK;
permissions:
